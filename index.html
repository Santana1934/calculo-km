<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Field Service KM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#121212">
</head>
<body>
    <div id="auth-screen" class="screen active">
        <div class="auth-card">
            <h2>Field Service KM</h2>
            <p>Insira a chave de acesso para continuar</p>
            <input type="password" id="access-key-input" placeholder="Chave de acesso">
            <button id="btn-login" class="btn-primary">Entrar</button>
        </div>
    </div>

    <div id="app-screen" class="screen">
        <header>
            <h1>Controle de KM</h1>
            <div class="header-actions">
                <button id="btn-shortcuts" class="btn-icon" title="Atalhos rápidos">📍</button>
                <button id="btn-settings" class="btn-icon" title="Parâmetros">⚙️</button>
            </div>
        </header>

        <main>
            <section class="card summary-card">
                <h2>Resumo geral</h2>
                <div class="summary-grid">
                    <div>
                        <span>Total KM Rodado</span>
                        <strong id="sum-km">0 km</strong>
                    </div>
                    <div>
                        <span>Total Reembolso KM</span>
                        <strong id="sum-reimbursement">R$ 0,00</strong>
                    </div>
                    <div>
                        <span>Total Despesas (Combustível)</span>
                        <strong id="sum-fuel">R$ 0,00</strong>
                    </div>
                    <div>
                        <span>Saldo cartão restante</span>
                        <strong id="sum-card-balance">R$ 0,00</strong>
                    </div>
                </div>
            </section>

            <div class="tab-container">
                <button class="tab-btn active" data-tab="tab-travel">Viagem (KM)</button>
                <button class="tab-btn" data-tab="tab-fuel">Abastecimento / Gasto</button>
            </div>

            <!-- Formulário Viagem -->
            <form id="form-travel" class="form-section active">
                <div class="input-group">
                    <label>Mês / Ano</label>
                    <input type="text" id="travel-month" placeholder="Ex: 03/2026" required>
                </div>
                <div class="input-group">
                    <label>Cliente / Local</label>
                    <input type="text" id="travel-client" placeholder="Ex: Empresa ABC" required>
                </div>
                <div class="input-group">
                    <label>Nº Protocolo (Opcional)</label>
                    <input type="text" id="travel-protocol" placeholder="Ex: 123456">
                </div>
                <div class="input-group">
                    <label>KM Atual do Painel</label>
                    <input type="number" id="travel-km" placeholder="Ex: 45200" required>
                </div>
                <button type="submit" class="btn-primary">Registrar Viagem</button>
            </form>

            <!-- Formulário Abastecimento -->
            <form id="form-fuel" class="form-section">
                <div class="input-group">
                    <label>Mês / Ano</label>
                    <input type="text" id="fuel-month" placeholder="Ex: 03/2026" required>
                </div>
                <div class="input-group">
                    <label>Posto / Estabelecimento</label>
                    <input type="text" id="fuel-place" placeholder="Ex: Auto Posto X" required>
                </div>
                <div class="input-group">
                    <label>Valor Gasto (R$)</label>
                    <input type="number" step="0.01" id="fuel-value" placeholder="Ex: 150.00" required>
                </div>
                <button type="submit" class="btn-primary">Registrar Gasto</button>
            </form>

            <section class="card history-card">
                <h2>Histórico por dia</h2>
                <div id="history-list">
                    <p class="empty-msg">Nenhum registro encontrado.</p>
                </div>
            </section>
        </main>

        <div class="action-bar">
            <button id="btn-export-pdf" class="btn-secondary">Exportar PDF</button>
            <button id="btn-clear-data" class="btn-danger">Limpar Dados</button>
        </div>
    </div>

    <!-- Modal Configurações -->
    <div id="modal-settings" class="modal">
        <div class="modal-content">
            <h3>Parâmetros Financeiros</h3>
            <div class="input-group">
                <label>Nome do Técnico</label>
                <input type="text" id="cfg-tech-name" placeholder="Seu nome completo">
            </div>
            <div class="input-group">
                <label>Valor por KM (R$ / KM)</label>
                <input type="number" step="0.01" id="cfg-km-rate" placeholder="Ex: 0.65">
            </div>
            <div class="input-group">
                <label>Valor solicitado em cartão do mês</label>
                <input type="number" step="0.01" id="cfg-card-requested" placeholder="Ex: 500.00">
            </div>
            <div class="input-group">
                <label>Ajuda de Custo Fixa (R$)</label>
                <input type="number" step="0.01" id="cfg-fixed-aid" value="0.00">
            </div>
            <div class="modal-actions">
                <button id="btn-save-settings" class="btn-primary">Salvar</button>
                <button id="btn-close-settings" class="btn-secondary">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Modal Atalhos -->
    <div id="modal-shortcuts" class="modal">
        <div class="modal-content">
            <h3>Atalhos Rápidos</h3>
            <div class="input-group">
                <label>Endereço de Casa</label>
                <input type="text" id="shortcut-home" placeholder="Rua Exemplo, 123">
            </div>
            <div class="input-group">
                <label>Endereço da Empresa</label>
                <input type="text" id="shortcut-company" placeholder="Av. Principal, 456">
            </div>
            <div class="modal-actions">
                <button id="btn-save-shortcuts" class="btn-primary">Salvar Atalhos</button>
                <button id="btn-close-shortcuts" class="btn-secondary">Fechar</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
