<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Operacional - KM</title>
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE BLOQUEIO / ACESSO RESTRITO -->
    <div id="lock-screen" class="lock-screen-overlay">
        <div class="lock-card">
            <h2>🔒 Acesso Restrito</h2>
            <p>Insira a chave de acesso para utilizar o sistema.</p>
            <input type="password" id="access-key-input" placeholder="Digite a chave..." />
            <button id="unlock-btn">Entrar</button>
            <p id="lock-error" class="error-msg" style="display: none;">Chave incorreta!</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO APP -->
    <div id="app-content" class="app-container" style="display: none;">
        <header>
            <h1>Controle Operacional</h1>
        </header>

        <!-- PARÂMETROS FINANCEIROS -->
        <section class="card parameters-card">
            <div class="card-header">
                <h2>⚙️ Parâmetros Financeiros</h2>
                <button id="edit-params-btn" class="secondary-btn">Editar Parâmetros</button>
            </div>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>TÉCNICO</label>
                    <input type="text" id="tech-name" placeholder="Nome do Técnico" disabled>
                </div>
                <div class="input-group">
                    <label>MÊS/ANO</label>
                    <input type="text" id="month-year" placeholder="Ex: JULHO/2026" disabled>
                </div>
                <div class="input-group">
                    <label>AJUDA DE CUSTO FIXA (R$)</label>
                    <input type="number" id="fixed-aid" placeholder="0.00" disabled>
                </div>
                <div class="input-group">
                    <label>R$ / KM (EMPRESA)</label>
                    <input type="number" step="0.01" id="km-rate" placeholder="0.00" disabled>
                </div>
                <div class="input-group full-width">
                    <label>VALOR CAJU DO MÊS (R$)</label>
                    <input type="number" id="caju-value" placeholder="Informe seu valor particular" disabled>
                </div>
            </div>
        </section>

        <!-- BOTÕES DE AÇÃO RÁPIDA -->
        <div class="action-buttons-grid">
            <button id="btn-parada" class="action-btn">🚗 Parada / Cliente</button>
            <button id="btn-abastecimento" class="action-btn">⛽ Abastecimento</button>
        </div>

        <!-- FORMULÁRIO DE LANÇAMENTO / ETAPA -->
        <section class="card">
            <h2>Registro de KM / Atendimento</h2>
            <div class="input-group" style="margin-top: 12px;">
                <label>CLIENTE / LOCAL</label>
                <input type="text" id="local-name" placeholder="Ex: Cliente XYZ ou Av. Paulista">
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label>Nº PROTOCOLO (OPCIONAL)</label>
                <input type="text" id="protocol-num" placeholder="Ex: 98452">
            </div>
            <div class="input-group" style="margin-top: 12px;">
                <label>KM ATUAL DO PAINEL / ETAPA</label>
                <input type="number" id="current-km" placeholder="Ex: 80">
            </div>
            <button id="save-entry-btn" class="primary-btn" style="width: 100%; margin-top: 16px;">Salvar Lançamento</button>
        </section>

        <!-- HISTÓRICO E RESUMO -->
        <section class="card">
            <h2>Resumo e Histórico</h2>
            <div id="history-list" style="margin-top: 12px; font-size: 14px; color: #8b949e;">
                Nenhum lançamento registrado ainda.
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
