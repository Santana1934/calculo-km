<!-- index.html -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle Operacional - KM</title>
    <!-- Configurações para PWA e Tela Cheia -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0d1117">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- TELA DE BLOQUEIO / ACESSO RESTRITO -->
    <div id="lock-screen" class="lock-screen-overlay">
        <div class="lock-card">
            <h2>🔒 Acesso Restrito</h2>
            <p>Insira a chave de acesso para utilizar o sistema.</p>
            <input type="password" id="access-key-input" placeholder="Digite a chave..." />
            <button id="unlock-btn">Entrar</button>
            <p id="lock-error" class="error-msg" style="display: none;">Chave incorreta!</p>
        </div>
    </div>

    <!-- CONTEÚDO PRINCIPAL DO APP -->
    <div id="app-content" class="app-container" style="display: none;">
        <header>
            <h1>Controle Operacional</h1>
        </header>

        <section class="card parameters-card">
            <div class="card-header">
                <h2>⚙️ Parâmetros Financeiros</h2>
                <button id="edit-params-btn" class="secondary-btn">Editar Parâmetros</button>
            </div>
            
            <div class="input-grid">
                <div class="input-group">
                    <label>TÉCNICO</label>
                    <input type="text" id="tech-name" placeholder="Nome do Técnico" disabled>
                </div>
                <div class="input-group">
                    <label>MÊS/ANO</label>
                    <input type="text" id="month-year" placeholder="JULHO/2026" disabled>
                </div>
                <div class="input-group">
                    <label>AJUDA DE CUSTO FIXA (R$)</label>
                    <input type="number" id="fixed-aid" value="300" disabled>
                </div>
                <div class="input-group">
                    <label>R$ / KM (EMPRESA)</label>
                    <input type="number" step="0.1" id="km-rate" value="1.3" disabled>
                </div>
                <div class="input-group full-width">
                    <label>VALOR CAJU DO MÊS (R$)</label>
                    <input type="number" id="caju-value" value="" placeholder="Informe seu valor particular" disabled>
                </div>
            </div>
        </section>

        <!-- Outras seções operacionais continuam aqui -->
    </div>

    <script src="script.js"></script>
</body>
</html>
