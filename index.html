<div class="card">
            <div class="card-header-flex no-print" style="margin-bottom: 12px; align-items: center; flex-wrap: wrap; gap: 8px;">
                <h3 style="margin: 0;">📅 Histórico por Dia</h3>
                <div style="display: flex; align-items: center; gap: 6px;">
                    <input type="date" id="filter-date" class="input-date-filter" onchange="renderHistory()" style="background: #1e293b; border: 1px solid #334155; color: #f8fafc; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; cursor: pointer;">
                    <button type="button" class="btn-subtle" onclick="clearDateFilter()" style="padding: 4px 8px; font-size: 0.75rem;">Ver Todos</button>
                </div>
            </div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>Cliente / Local</th>
                            <th>Protocolo / OS</th>
                            <th>KM Rodado</th>
                            <th class="no-print">Ação</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                    </tbody>
                </table>
            </div>

            <div class="pdf-totals">
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid #ccc;">
                <p><strong>TOTAL DE KM RODADOS:</strong> <span id="pdf-total-km">0</span> KM</p>
                <p><strong>CÁLCULO KM:</strong> <span id="pdf-calc-km">0 KM × R$ 1.30 = R$ 0.00</span></p>
                <p><strong>AJUDA DE CUSTO FIXA:</strong> R$ <span id="pdf-summary-base">300.00</span></p>
                <hr style="margin: 10px 0; border: 0; border-top: 1px solid #000;">
                <p style="font-size: 1.1rem;"><strong>VALOR TOTAL DE REEMBOLSO:</strong> <span id="pdf-final-reimbursement">R$ 300.00</span></p>
            </div>

            <div class="no-print" style="margin-top: 16px; display: flex; flex-direction: column; gap: 10px;">
                <button class="btn-subtle" onclick="printPDF()" style="width: 100%; padding: 12px; font-weight: 600; cursor: pointer;">🖨️ Gerar PDF / Imprimir</button>
                <button class="btn-clear-all" onclick="openConfirmModal()">Apagar Registros do Mês</button>
            </div>
        </div>
